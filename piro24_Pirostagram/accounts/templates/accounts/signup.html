{% extends 'base.html' %}

{% block title %}회원가입 - Pirostagram{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h1>Pirostagram</h1>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary">가입하기</button>
        </form>
        <p class="auth-link">
            이미 계정이 있으신가요? <a href="{% url 'accounts:login' %}">로그인</a>
        </p>
    </div>
</div>
{% endblock %}
